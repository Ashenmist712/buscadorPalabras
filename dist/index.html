<!doctype html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#050505><title>Buscador de Palabras</title><style>*{box-sizing:border-box}body{color:#f5f5f5;background:#f4f4f4;min-width:320px;min-height:100vh;margin:0;font-family:Arial,Helvetica,sans-serif}.buscador{background:#050505;min-height:100vh;padding:38px 20px 48px;box-shadow:0 5px 18px rgb(0 0 0 / 18%)}.buscador__contenido{width:min(100%,680px);margin:0 auto}h1{color:#f1f1f1;text-align:center;margin:0;font-size:22px;font-weight:600}.buscador__descripcion{color:#aaa;text-align:center;margin:13px 0 25px;font-size:12px;line-height:1.6}.buscador__formulario{gap:12px;display:grid}label{color:#ccc;font-size:13px}input,textarea{color:#f5f5f5;background:#292929;border:0;border-bottom:2px solid #aaa;border-radius:0;outline:none;width:100%;font:inherit;transition:border-color.15s,background-color.15s}input:focus,textarea:focus{background:#303030;border-bottom-color:#fff}input::placeholder,textarea::placeholder{color:#999;opacity:1}#textoInput{resize:vertical;min-height:105px;padding:12px}#palabraBuscar{min-height:42px;padding:0 12px}.buscador__acciones{justify-content:center;gap:12px;padding-top:2px;display:flex}button{color:#f5f5f5;cursor:pointer;background:none;border:1px solid #ddd;border-radius:0;min-width:96px;padding:10px 18px;font:inherit;font-size:13px;transition:background-color.15s,color.15s}button:focus-visible,button:hover{color:#111;background:#f5f5f5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #f5f5f5;outline-offset:3px}#resultado:empty,#textoProcesado:empty{display:none}#resultado{margin-top:22px}.alerta{border:1px solid;margin:0;padding:11px 13px;font-size:14px;line-height:1.5}.alerta--error{color:#ffd9dc;background:#361b1e;border-color:#b94a55}.alerta--success{color:#d2f4df;background:#172d23;border-color:#438568}#textoProcesado{color:#eee;white-space:pre-wrap;border:1px solid #555;margin-top:12px;padding:15px;line-height:1.7;overflow-wrap:anywhere}mark{color:#171717;background:#f2d34f;border-radius:2px}@media (max-width:480px){.buscador{padding:32px 18px}h1{font-size:20px}}</style><script defer src=bundle.js></script></head><body><main class=buscador><div class=buscador__contenido><h1>Buscador de Palabras</h1><p class=buscador__descripcion>Escribe un texto y la palabra que quieres encontrar. La búsqueda no distingue mayúsculas ni acentos.<form class=buscador__formulario id=formularioBuscador><label for=textoInput>Texto</label> <textarea id=textoInput rows=5 placeholder="Escribe o pega tu texto aquí..."></textarea> <label for=palabraBuscar>Palabra a buscar</label> <input id=palabraBuscar placeholder="Escribe la palabra..."><div class=buscador__acciones><button id=btn_Buscar type=submit>Buscar</button> <button id=btn_Limpiar type=button>Limpiar</button></div></form><div id=resultado aria-live=polite></div><div id=textoProcesado aria-label="Texto con coincidencias resaltadas"></div></div></main></body></html>
